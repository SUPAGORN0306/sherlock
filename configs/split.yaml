# Validation: Nov 26 - Dec 14
# Test: Dec 15 - Dec 31
temporal_split:
  train_end: "2025-11-25 23:59:59"
  val_start: "2025-11-26 00:00:00"
  val_end: "2025-12-14 23:59:59"
  test_start: "2025-12-15 00:00:00"
  test_end: "2025-12-31 23:59:59"

# Statistics verified by chunked audit of data/tx.csv
