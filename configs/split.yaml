    transactions: 2714741
    fraud: 4213
    fraud_rate: 0.1552
    days: 329

  val:
    transactions: 161834
    fraud: 267
    fraud_rate: 0.1650
    days: 19

  test:
    transactions: 152595
    fraud: 161
