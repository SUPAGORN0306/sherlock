  transactions: 3029170
  fraud: 4641
  fraud_rate: 0.1532
  days: 365

# Account coverage
# Account identity is defined as Bank ID + Account ID.
# Overlap is measured against the training account set.
entity_coverage:
  train_accounts: 44162
  train_unseen: 0
  train_overlap_pct: 100.0

  val_accounts: 12420
  val_unseen: 1786
  val_overlap_pct: 85.62

  test_accounts: 12217
  test_unseen: 3364
  test_overlap_pct: 72.46

# Temporal Features
temporal_features:
  - hour
  - dow
  - month
  - day
  - is_weekend
  - is_night
  - is_business_hour
  - is_peak_month

# Splitting Strategy
strategy:
  type: "temporal"
  leakage_prevention: true
  inductive: true

# Known Constraints
constraints:
  - "Temporal split only; random split is prohibited."
  - "Train has 4,213 laundering transactions."
  - "Validation has 267 laundering transactions."
  - "Test has 161 laundering transactions; evaluation uncertainty may be high."
  - "Test account overlap with Train is 72.46% using Bank ID + Account ID."
  - "Cold-start performance must be evaluated separately on unseen accounts."
  - "Verify feature generation and leakage prevention in the actual pipeline."
  - "Temporal feature definitions must match the implementation."

# Reproducibility
seed: 42
